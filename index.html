<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mini 3D Engine</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="ui">
  <h2>Mini 3D Engine</h2>

  <input type="file" id="textureInput" accept="image/png">
  <button id="addCube">Agregar Cubo</button>
  <button id="fullscreen">Pantalla Completa</button>
  <button id="export">Exportar Escena</button>

  <textarea id="codeEditor">// Código JS interactivo
selectedObject.rotation.y += 0.01;
</textarea>

  <button id="runCode">Ejecutar Código</button>
</div>

<canvas id="scene"></canvas>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/OrbitControls.js"></script>
<script src="main.js"></script>

</body>
</html>

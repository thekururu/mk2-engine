<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Mini 3D Engine</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>

  <!-- CANVAS 3D -->
  <canvas id="viewport"></canvas>

  <!-- UI DEL EDITOR -->
  <div id="editor-ui">
    <h3>Mini 3D Engine</h3>

    <button id="addCube">➕ Crear Cubo</button>

    <hr />

    <label>Texturas (.png)</label>
    <input type="file" id="textureInput" accept="image/png" />
    <button id="applyTexture">🎨 Aplicar textura</button>

    <hr />

    <label>Modelos</label>
    <input type="file" id="modelInput" />

    <hr />

    <label>Sonidos</label>
    <input type="file" id="soundInput" />
    <button id="playSound">🔊 Play sound</button>

    <hr />

    <button id="fullscreen">🖥 Pantalla completa</button>
    <button id="export">💾 Exportar escena</button>
    <button id="screenshot">📸 Screenshot</button>
  </div>

  <!-- BOOTSTRAP -->
  <script type="module" src="./main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>MK2 Mini 3D Engine</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #111;
      font-family: Arial, sans-serif;
    }

    #ui {
      position: fixed;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.6);
      padding: 10px;
      border-radius: 8px;
      color: white;
      z-index: 10;
    }

    #ui button,
    #ui input {
      display: block;
      margin-bottom: 6px;
      width: 160px;
    }
  </style>
</head>

<body>

  <!-- UI -->
  <div id="ui">
    <button id="addCube">➕ Crear Cubo</button>

    <input type="file" id="textureInput" accept="image/png" />
    <button id="applyTexture">🎨 Aplicar Textura</button>

    <input type="file" id="modelInput" accept=".gltf,.glb" />

    <input type="file" id="soundInput" accept="audio/*" />
    <button id="playSound">🔊 Reproducir Sonido</button>

    <button id="fullscreen">🖥 Pantalla Completa</button>
    <button id="export">💾 Exportar Escena</button>
    <button id="screenshot">📸 Screenshot</button>
  </div>

  <!-- SOLO ESTE SCRIPT -->
  <script type="module" src="./main.js"></script>

</body>
</html>
